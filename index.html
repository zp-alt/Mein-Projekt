<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat mit Claude</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 20px;
    }
    h1 { text-align: center; margin-bottom: 16px; color: #333; }
    #chat {
      flex: 1;
      background: white;
      border-radius: 8px;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .message {
      padding: 10px 14px;
      border-radius: 8px;
      max-width: 80%;
      line-height: 1.5;
    }
    .user {
      background: #0084ff;
      color: white;
      align-self: flex-end;
    }
    .claude {
      background: #e8e8e8;
      color: #333;
      align-self: flex-start;
    }
    #input-area {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    #user-input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }
    button {
      padding: 12px 20px;
      background: #0084ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #api-key-area {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    #api-key-input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Chat mit Claude</h1>

  <div id="api-key-area">
    <input id="api-key-input" type="password" placeholder="Anthropic API-Key eingeben..." />
    <button onclick="saveKey()">Speichern</button>
  </div>

  <div id="chat"></div>

  <div id="input-area">
    <input id="user-input" type="text" placeholder="Schreib eine Nachricht..." onkeydown="if(event.key==='Enter') sendMessage()" />
    <button id="send-btn" onclick="sendMessage()">Senden</button>
  </div>

  <script>
    let apiKey = "";
    const history = [];

    function saveKey() {
      apiKey = document.getElementById("api-key-input").value.trim();
      if (apiKey) {
        document.getElementById("api-key-area").style.display = "none";
        addMessage("system", "API-Key gespeichert. Du kannst jetzt chatten!");
      }
    }

    function addMessage(role, text) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.className = "message " + (role === "user" ? "user" : "claude");
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      if (!apiKey) { alert("Bitte erst den API-Key eingeben!"); return; }
      const input = document.getElementById("user-input");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      addMessage("user", text);
      history.push({ role: "user", content: text });

      const btn = document.getElementById("send-btn");
      btn.disabled = true;

      try {
        const response = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": apiKey,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true"
          },
          body: JSON.stringify({
            model: "claude-sonnet-4-6",
            max_tokens: 1024,
            messages: history
          })
        });

        const data = await response.json();
        const reply = data.content[0].text;
        history.push({ role: "assistant", content: reply });
        addMessage("claude", reply);
      } catch (err) {
        addMessage("claude", "Fehler: " + err.message);
      }

      btn.disabled = false;
      input.focus();
    }
  </script>
</body>
</html>
