<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
@font-face{font-family:"Roboto";font-weight:500;src:url("assets/fonts/Roboto-Medium.ttf")}
@font-face{font-family:"Roboto";font-weight:700;src:url("assets/fonts/Roboto-Bold.ttf")}
@font-face{font-family:"Roboto";font-weight:900;src:url("assets/fonts/Roboto-Black.ttf")}
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@page{size:105mm 148mm;margin:0}
.card{position:relative;width:105mm;height:148mm;overflow:hidden;page-break-after:always}
.card:last-child{page-break-after:auto}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.logo{position:absolute;width:20mm;height:20mm;filter:drop-shadow(0 1mm 2.5mm rgba(0,0,0,.4));z-index:2}
.slogan{position:absolute;z-index:2;font-family:"Roboto",sans-serif;font-weight:700;font-size:15.5pt;line-height:1.06;letter-spacing:-.01em}
.slogan.w{color:#fff;text-shadow:0 1mm 3.5mm rgba(0,0,0,.6),0 0 1mm rgba(0,0,0,.4)}
.slogan.d{color:#161616;text-shadow:0 1mm 3.5mm rgba(255,255,255,.55),0 0 1mm rgba(255,255,255,.4)}
</style></head><body><section class="card"><div class="bg" style="background-image:url('assets/postcards/pc1.jpg')"></div><img class="logo" src="assets/pre_logo.png" style="top:7mm;left:7mm"/><div class="slogan w" style="right:7mm;bottom:9mm;text-align:right;width:55mm">Art has no front.</div></section>
<section class="card"><div class="bg" style="background-image:url('assets/postcards/pc2.jpg')"></div><img class="logo" src="assets/pre_logo.png" style="bottom:7mm;right:7mm"/><div class="slogan d" style="left:8mm;top:74mm;text-align:left;width:52mm;transform:rotate(-8deg)">Gravity&rsquo;s optional.</div></section>
<section class="card"><div class="bg" style="background-image:url('assets/postcards/pc3.jpg')"></div><img class="logo" src="assets/pre_logo.png" style="top:7mm;right:7mm"/><div class="slogan w" style="left:7mm;bottom:9mm;text-align:left;width:52mm">Chin up,<br>crown on.</div></section>
<section class="card"><div class="bg" style="background-image:url('assets/postcards/pc4.jpg')"></div><img class="logo" src="assets/pre_logo.png" style="top:7mm;left:7mm"/><div class="slogan d" style="right:8mm;top:24mm;text-align:right;width:48mm;transform:rotate(-6deg)">Let it fall.</div></section>
<section class="card"><div class="bg" style="background-image:url('assets/postcards/pc5.jpg')"></div><img class="logo" src="assets/pre_logo.png" style="top:7mm;right:7mm"/><div class="slogan d" style="left:7mm;top:58mm;text-align:left;width:46mm">Best entrance<br>is the exit.</div></section>
<section class="card"><div class="bg" style="background-image:url('assets/postcards/pc6.jpg')"></div><img class="logo" src="assets/pre_logo.png" style="bottom:7mm;left:7mm"/><div class="slogan d" style="right:7mm;top:9mm;text-align:right;width:50mm">Sharp suit.<br>Sharper cut.</div></section>
<section class="card"><div class="bg" style="background-image:url('assets/postcards/pc7.jpg')"></div><img class="logo" src="assets/pre_logo.png" style="top:7mm;left:7mm"/><div class="slogan w" style="left:0;right:0;bottom:9mm;text-align:center">Eye contact.<br>No filter.</div></section>
<section class="card"><div class="bg" style="background-image:url('assets/postcards/pc8.jpg')"></div><img class="logo" src="assets/pre_logo.png" style="top:7mm;right:7mm"/><div class="slogan w" style="left:7mm;bottom:9mm;text-align:left;width:52mm">Curls have<br>opinions.</div></section>
<section class="card"><div class="bg" style="background-image:url('assets/postcards/pc9.jpg')"></div><img class="logo" src="assets/pre_logo.png" style="bottom:7mm;right:7mm"/><div class="slogan d" style="left:7mm;top:8mm;text-align:left;width:50mm">Round of<br>applause.</div></section>
<section class="card"><div class="bg" style="background-image:url('assets/postcards/pc10.jpg')"></div><img class="logo" src="assets/pre_logo.png" style="top:7mm;right:7mm"/><div class="slogan d" style="left:7mm;bottom:9mm;text-align:left;width:52mm">Effortless<br>takes effort.</div></section>
<section class="card"><div class="bg" style="background-image:url('assets/postcards/pc11.jpg')"></div><img class="logo" src="assets/pre_logo.png" style="top:7mm;left:7mm"/><div class="slogan d" style="right:7mm;top:56mm;text-align:right;width:44mm">All angles.<br>No apologies.</div></section>
<section class="card"><div class="bg" style="background-image:url('assets/postcards/pc12.jpg')"></div><img class="logo" src="assets/pre_logo.png" style="bottom:7mm;left:7mm"/><div class="slogan d" style="right:7mm;top:9mm;text-align:right;width:44mm">Bounce<br>included.</div></section>
</body></html>
