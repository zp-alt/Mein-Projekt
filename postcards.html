<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
@font-face{font-family:"Roboto";font-weight:300;src:url("assets/fonts/Roboto-Light.ttf")}

*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.slogan.w{color:#fff}
.slogan.d{color:#141414}
</style></head><body><section class="card"><div class="bg" style="background-image:url('assets/postcards/pc1.jpg')"></div><img class="logo" src="assets/pre_logo.png" style="top:7mm;left:7mm"/><div class="slogan w" style="right:7mm;bottom:9mm;text-align:right;width:58mm">Art has no front.</div></section>
