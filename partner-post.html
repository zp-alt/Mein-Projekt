<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,300;1,200;1,300&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; }
    .wrap {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      background: #080808;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .bg {
      position: absolute; inset: 0;
      background-image: url(party-silhouettes.jpeg);
      background-size: cover;
      background-position: center;
      opacity: 0.07;
    }
    .vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.7) 100%);
    }
    .content {
      position: relative; z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 0 80px;
    }

    /* Header */
    .event-label {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.22);
      margin-bottom: 18px;
      text-align: center;
    }
    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 72px;
      color: #fff;
      line-height: 1.0;
      text-align: center;
      margin-bottom: 8px;
    }
    .headline .yellow { color: #FFE033; }
    .event-date {
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.20);
      text-align: center;
      margin-bottom: 64px;
    }

    .rule {
      width: 520px;
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin-bottom: 56px;
    }

    .partners-label {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: #FFE033;
      margin-bottom: 64px;
      text-align: center;
    }

    /* Logo grid */
    .logos {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 80px;
      width: 100%;
    }

    .logo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .logo-item img.icon {
      height: 110px;
      width: auto;
      object-fit: contain;
    }
    .logo-item img.wordmark {
      height: 28px;
      width: auto;
      object-fit: contain;
      opacity: 0.85;
    }
    .logo-item img.circle {
      height: 120px;
      width: 120px;
      object-fit: contain;
      border-radius: 50%;
    }
    .logo-name {
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.30);
      text-align: center;
    }

    .pre-mark {
      position: absolute;
      bottom: 44px; left: 0; right: 0;
      text-align: center;
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.12);
      z-index: 2;
    }
  </style>
</head>
