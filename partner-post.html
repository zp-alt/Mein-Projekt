<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,300;1,200;1,300&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; }
    .wrap {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      background: #f2f0ed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Subtle texture from party image */
    .bg {
      position: absolute; inset: 0;
      background-image: url(party-silhouettes.jpeg);
      background-size: cover;
      background-position: center;
      opacity: 0.04;
      mix-blend-mode: multiply;
    }

    .content {
      position: relative; z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 0 80px;
    }

    .event-label {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: rgba(0,0,0,0.28);
      margin-bottom: 18px;
      text-align: center;
    }
    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 72px;
      color: #0e0e0e;
      line-height: 1.0;
      text-align: center;
      margin-bottom: 8px;
    }
    .headline .gold { color: #8B6030; }
    .event-date {
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(0,0,0,0.28);
      text-align: center;
      margin-bottom: 60px;
    }
    .rule {
      width: 520px; height: 1px;
      background: rgba(0,0,0,0.10);
      margin-bottom: 52px;
    }
    .partners-label {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: #8B6030;
      margin-bottom: 60px;
      text-align: center;
    }

    .logos {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 80px;
      width: 100%;
    }
    .logo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .logo-item img.icon {
      height: 110px;
      width: auto;
      object-fit: contain;
    }
    .logo-item img.wordmark {
      height: 26px;
      width: auto;
      object-fit: contain;
    }
    .logo-item img.circle {
      height: 130px;
      width: 130px;
      object-fit: contain;
    }
    .logo-name {
      font-family: 'Barlow', sans-serif;
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(0,0,0,0.35);
    }

    .pre-mark {
      position: absolute;
      bottom: 44px; left: 0; right: 0;
      text-align: center;
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(0,0,0,0.18);
      z-index: 2;
    }
  </style>
</head>
