<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,200;1,300&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; }
    .wrap {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      background: #080808;
    }

    /* Subtle party image — very dark atmosphere */
    .bg {
      position: absolute; inset: 0;
      background-image: url(party-silhouettes.jpeg);
      background-size: cover;
      background-position: center center;
      opacity: 0.10;
    }

    /* Vignette */
    .vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center,
        transparent 0%,
        rgba(0,0,0,0.65) 100%
      );
      z-index: 1;
    }

    .content {
      position: absolute; inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 80px;
      text-align: center;
    }

    /* Top label */
    .event-label {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      margin-bottom: 20px;
    }

    /* Headline */
    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 68px;
      color: #ffffff;
      line-height: 1.0;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }
    .headline .yellow { color: #FFE033; }

    .event-date {
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.22);
      margin-bottom: 56px;
    }

    /* Divider */
    .rule-long {
      width: 100%;
      max-width: 520px;
      height: 1px;
      background: rgba(255,255,255,0.10);
      margin-bottom: 52px;
    }

    /* Partners label */
    .partners-label {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: #FFE033;
      margin-bottom: 44px;
    }

    /* Brand list */
    .brands {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      width: 100%;
    }

    .brand-item {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 22px 0;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      gap: 20px;
    }
    .brand-item:first-child {
      border-top: 1px solid rgba(255,255,255,0.07);
    }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 36px;
      color: rgba(255,255,255,0.85);
      letter-spacing: 2px;
      line-height: 1;
    }

    .brand-dot {
      width: 3px; height: 3px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      flex-shrink: 0;
    }

    .brand-type {
      font-family: 'Barlow', sans-serif;
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.22);
    }

    .bottom-mark {
      position: absolute;
      bottom: 48px; left: 0; right: 0;
      text-align: center;
      z-index: 2;
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bg"></div>
    <div class="vignette"></div>

    <div class="content">
      <div class="event-label">PRE — A Midsummer Night</div>
      <div class="headline">Unsere <span class="yellow">Partner.</span></div>
      <div class="event-date">30. August 2026 · Munich</div>

      <div class="rule-long"></div>
      <div class="partners-label">Mit freundlicher Unterstützung von</div>

      <div class="brands">
        <div class="brand-item">
          <span class="brand-name">Sephora</span>
          <span class="brand-dot"></span>
          <span class="brand-type">Goodie Bags</span>
        </div>
        <div class="brand-item">
          <span class="brand-name">Douup</span>
          <span class="brand-dot"></span>
          <span class="brand-type">Beauty</span>
        </div>
        <div class="brand-item">
          <span class="brand-name">Urban Alchemy</span>
          <span class="brand-dot"></span>
          <span class="brand-type">Hair Care</span>
        </div>
        <div class="brand-item">
          <span class="brand-name">Rieke</span>
          <span class="brand-dot"></span>
          <span class="brand-type">Fashion</span>
        </div>
        <div class="brand-item">
          <span class="brand-name">Lockenbox</span>
          <span class="brand-dot"></span>
          <span class="brand-type">Curl Care</span>
        </div>
        <div class="brand-item">
          <span class="brand-name">Linisbites</span>
          <span class="brand-dot"></span>
          <span class="brand-type">Food</span>
        </div>
      </div>
    </div>

    <div class="bottom-mark">PRE Art of Hair</div>
  </div>
</body>
</html>
