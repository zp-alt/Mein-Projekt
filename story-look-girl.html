<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700;800;900&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 360px; height: 640px;
      background: transparent;
      font-family: 'Barlow', sans-serif;
      overflow: hidden;
    }

    .logo {
      position: absolute;
      top: 26px; left: 28px;
      font-weight: 700; font-size: 10px;
      letter-spacing: 5px; text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 12px rgba(0,0,0,1), 0 0 4px rgba(0,0,0,1);
    }

    .text-block {
      position: absolute;
      bottom: 42px; left: 28px; right: 28px;
    }

    .greeting {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 300;
      font-size: 22px;
      color: #fff;
      letter-spacing: 1px;
      margin-bottom: 10px;
      text-shadow: 0 0 16px rgba(0,0,0,1), 0 2px 8px rgba(0,0,0,1);
    }

    .main {
      font-weight: 900;
      font-size: 40px;
      line-height: 0.95;
      letter-spacing: -1px;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 14px;
      text-shadow: 0 0 20px rgba(0,0,0,1), 0 2px 10px rgba(0,0,0,1);
    }

    .accent {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 400;
      font-size: 20px;
      color: #fff;
      letter-spacing: 0.5px;
      line-height: 1.45;
      text-shadow: 0 0 16px rgba(0,0,0,1), 0 2px 8px rgba(0,0,0,1);
    }
  </style>
</head>
<body>
  <div class="logo">PRE · Art of Hair</div>
  <div class="text-block">
    <div class="greeting">Look at this girl —</div>
    <div class="main">die mich<br>besucht hat.</div>
    <div class="accent">...und ich hab einfach vergessen<br>ein Nachher-Foto zu machen.</div>
  </div>
</body>
</html>
