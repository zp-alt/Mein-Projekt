<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>PRE Roll-up Single Fullbleed</title>
<style>
  @font-face{font-family:"Roboto";font-weight:300;src:url("assets/fonts/Roboto-Light.ttf")}
  @font-face{font-family:"Roboto";font-weight:500;src:url("assets/fonts/Roboto-Medium.ttf")}
  @font-face{font-family:"Roboto";font-weight:700;src:url("assets/fonts/Roboto-Bold.ttf")}
  @font-face{font-family:"Roboto";font-weight:900;src:url("assets/fonts/Roboto-Black.ttf")}
  @font-face{font-family:"EBGaramond";font-style:italic;font-weight:400;src:url("assets/fonts/EBGaramond-Italic.otf")}
  :root{ --ink:#1a1a1a; --paper:#faf8f4; --petrol:#11514c; --petrol-soft:#5d8b86; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{ size:850mm 2000mm; margin:0; }
  html,body{ background:#888; }
  body{ font-family:"Roboto",sans-serif; color:var(--ink); }
  .banner{ position:relative; width:850mm; height:2000mm; overflow:hidden; background:#d8d8d8; }

  /* komplettes Foto vollstaendig sichtbar (nichts abgeschnitten, kein Fade der etwas verdeckt) */
  .photo{ position:absolute; inset:0; background-image:url('assets/coll_2.jpg');
          background-size:100% auto; background-position:center 44%; background-repeat:no-repeat; z-index:0; }

  .geo{ position:absolute; z-index:3; }
  .ring{ width:270mm; height:270mm; border:11mm solid var(--petrol); border-radius:50%; top:135mm; left:700mm; }
  .sq{ width:115mm; height:115mm; background:var(--ink); top:150mm; left:44mm; }
  .tri{ width:0;height:0; border-left:90mm solid transparent; border-right:90mm solid transparent;
        border-bottom:158mm solid var(--petrol); bottom:150mm; left:40mm; }

  .logo{ position:absolute; top:120mm; left:50%; transform:translateX(-50%); width:220mm; height:220mm; z-index:4; }
  .brand{ position:absolute; top:352mm; left:0; right:0; text-align:center; color:var(--ink); z-index:4;
          font-family:"Roboto",sans-serif; font-weight:300; font-size:68pt; line-height:1.02; }
  .brand .tog{ font-family:"EBGaramond",serif; font-style:italic; font-weight:400; font-size:104pt; }

  .foot{ position:absolute; left:0; right:0; bottom:150mm; text-align:center; z-index:4; }
  .foot .handle{ font-weight:900; font-size:104pt; letter-spacing:.01em; color:var(--ink); }
  .foot .city{ font-weight:500; font-size:40pt; letter-spacing:.3em; text-transform:uppercase; color:var(--petrol-soft); margin-top:14mm; }
</style>
</head>
<body>
  <div class="banner">
    <div class="photo"></div>

    <div class="geo ring"></div>
    <div class="geo sq"></div>
    <div class="geo tri"></div>

    <img class="logo" src="assets/pre_logo.png" alt="PRE" />
    <div class="brand">Let&rsquo;s style<br><span class="tog">together</span></div>

    <div class="foot">
      <div class="handle">@pre.munich</div>
      <div class="city">Art of Hair · München</div>
    </div>
  </div>
</body>
</html>
