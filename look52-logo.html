<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; }
    .wrap {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
    }
    .photo {
      position: absolute; inset: 0;
      background-image: url(look52.jpeg);
      background-size: cover;
      background-position: center 20%;
    }
    /* Overlay für Kontrast */
    .photo::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.28);
    }
    /* PRE logo — groß zentriert */
    .logo {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .logo .mark {
      font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
      font-style: normal;
      font-weight: 900;
      font-size: 220px;
      color: #ffffff;
      line-height: 1;
      letter-spacing: 12px;
      text-transform: uppercase;
    }
    .logo .rule {
      width: 60px; height: 1px;
      background: rgba(255,255,255,0.45);
      margin: 24px 0 20px;
    }
    .logo .sub {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 16px;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.70);
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="photo"></div>
    <div class="logo">
      <div class="mark">PRE</div>
      <div class="rule"></div>
      <div class="sub">Art of Hair</div>
    </div>
  </div>
</body>
</html>
