<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,300;1,200;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; }
    .wrap {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
    }

    /* Left half: editorial hair shot */
    .photo-left {
      position: absolute;
      top: 0; left: 0;
      width: 55%;
      height: 100%;
      background-image: url(look52.jpeg);
      background-size: cover;
      background-position: center center;
    }
    .photo-left::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(
        to right,
        rgba(0,0,0,0.15) 0%,
        rgba(0,0,0,0.50) 100%
      );
    }

    /* Right half: party / community */
    .photo-right {
      position: absolute;
      top: 0; right: 0;
      width: 55%;
      height: 100%;
      background-image: url(party-silhouettes.jpeg);
      background-size: cover;
      background-position: center center;
    }
    .photo-right::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(
        to left,
        rgba(0,0,0,0.10) 0%,
        rgba(0,0,0,0.55) 100%
      );
    }

    /* Center seam blend */
    .seam {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.65) 0%,
        rgba(0,0,0,0.30) 25%,
        rgba(0,0,0,0.20) 50%,
        rgba(0,0,0,0.30) 75%,
        rgba(0,0,0,0.65) 100%
      );
      z-index: 2;
    }

    /* Top PRE mark */
    .pre-mark {
      position: absolute;
      top: 48px; left: 0; right: 0;
      text-align: center;
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      z-index: 10;
    }

    /* Center text */
    .center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 10;
    }

    .a-word {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 50px;
      color: rgba(255,255,255,0.65);
      letter-spacing: 4px;
    }
    .midsummer {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 200;
      font-size: 128px;
      color: #ffffff;
      line-height: 0.90;
      letter-spacing: -2px;
    }
    .night {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 200;
      font-size: 128px;
      color: #FFE033;
      line-height: 0.90;
      letter-spacing: -2px;
      margin-bottom: 44px;
    }
    .rule {
      width: 48px; height: 1px;
      background: rgba(255,255,255,0.28);
      margin-bottom: 36px;
    }
    .date {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 50px;
      letter-spacing: 6px;
      color: #ffffff;
      margin-bottom: 16px;
    }
    .save {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #FFE033;
    }

    /* Bottom */
    .bottom {
      position: absolute;
      bottom: 52px; left: 0; right: 0;
      text-align: center;
      z-index: 10;
    }
    .city {
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.22);
    }
    .guests {
      font-family: 'Barlow', sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.40);
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="photo-left"></div>
    <div class="photo-right"></div>
    <div class="seam"></div>

    <div class="pre-mark">PRE Art of Hair</div>

    <div class="center">
      <div class="a-word">A</div>
      <div class="midsummer">Midsummer</div>
      <div class="night">Night</div>
      <div class="rule"></div>
      <div class="date">30. August 2026</div>
      <div class="save">Save the Date</div>
    </div>

    <div class="bottom">
      <div class="city">Munich</div>
      <div class="guests">Limitierte Plätze</div>
    </div>
  </div>
</body>
</html>
