<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<style>
  @font-face{font-family:"Roboto";font-weight:300;src:url("assets/fonts/Roboto-Light.ttf")}
  @font-face{font-family:"Roboto";font-weight:500;src:url("assets/fonts/Roboto-Medium.ttf")}
  @font-face{font-family:"Roboto";font-weight:700;src:url("assets/fonts/Roboto-Bold.ttf")}
  @font-face{font-family:"Roboto";font-weight:900;src:url("assets/fonts/Roboto-Black.ttf")}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{margin:0;padding:0}
  .card{ position:relative; width:1080px; height:1350px; overflow:hidden;
         font-family:"Roboto",sans-serif; color:#fff; background:#1a1a1a; }

  .photo{ position:absolute; inset:0; background-image:url('assets/ig_chair_scene.jpg');
          background-size:cover; background-position:50% 46%; }
  /* weicher, randloser Verlauf – dunkler in der Mitte, damit die weisse Schrift sauber liest */
  .scrim{ position:absolute; inset:0; background:
      radial-gradient(ellipse 92% 52% at 50% 49%, rgba(10,10,12,.52) 0%, rgba(10,10,12,.22) 58%, rgba(10,10,12,.30) 100%); }

  .quote{ position:absolute; left:60px; right:60px; top:50%; transform:translateY(-50%); text-align:center; }
  .quote .q{ font-weight:900; text-transform:uppercase; line-height:1.04; letter-spacing:-.01em; font-size:58px;
             text-shadow:0 2px 20px rgba(0,0,0,.6); }
  .rule{ width:84px; height:3px; background:#fff; margin:28px auto; opacity:.95; box-shadow:0 2px 14px rgba(0,0,0,.5); }

  .foot{ position:absolute; left:0; right:0; bottom:86px; text-align:center; }
  .foot .handle{ font-weight:700; font-size:22px; letter-spacing:.26em; text-transform:uppercase; color:#fff;
                 text-shadow:0 2px 14px rgba(0,0,0,.55); }
</style>
</head>
<body>
  <div class="card">
    <div class="photo"></div>
    <div class="scrim"></div>

    <div class="quote">
      <div class="q">The algorithm<br>is cute.</div>
      <div class="rule"></div>
      <div class="q">But word of mouth<br>built my business.</div>
    </div>

    <div class="foot">
      <div class="handle">@pre.munich&nbsp;&nbsp;·&nbsp;&nbsp;München</div>
    </div>
  </div>
</body>
</html>
