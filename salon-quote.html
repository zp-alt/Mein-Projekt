<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; }
    .wrap {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
    }
    .photo {
      position: absolute; inset: 0;
      background-image: url(salon-quote-orig.jpeg);
      background-size: cover;
      background-position: center top;
    }
    .photo::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.68);
    }
    .pre-mark {
      position: absolute;
      top: 36px; left: 40px;
      font-family: 'Barlow', sans-serif;
      font-weight: 700; font-size: 11px;
      letter-spacing: 4px; text-transform: uppercase;
      color: rgba(255,255,255,0.30);
      z-index: 2;
    }
    .content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      padding: 0 60px;
      z-index: 2;
    }
    .eyebrow {
      font-family: 'Barlow', sans-serif;
      font-size: 44px; font-weight: 700;
      letter-spacing: 4px; text-transform: uppercase;
      color: rgba(255,255,255,0.75);
      margin-bottom: 28px;
      text-align: center;
    }
    .quote {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 300;
      font-size: 96px; color: #fff;
      line-height: 0.98; letter-spacing: -1.5px;
      margin-bottom: 32px;
      text-align: center;
    }
    .quote .c { color: #5DC87A; }
    .rule {
      width: 60px; height: 1px;
      background: rgba(255,255,255,0.25);
      margin-bottom: 28px;
      align-self: center;
    }
    .sub {
      font-family: 'Barlow', sans-serif;
      font-size: 44px; font-weight: 600;
      color: rgba(255,255,255,0.80);
      letter-spacing: 0.5px; line-height: 1.2;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="photo"></div>
    <div class="pre-mark">PRE Art of Hair</div>
    <div class="content">
      <div class="eyebrow">Girl to Girl</div>
      <div class="quote">
        If it's dead,<br>
        <span class="c">cut it.</span>
      </div>
      <div class="rule"></div>
      <div class="sub">Hair, habits or people.</div>
    </div>
  </div>
</body>
</html>
