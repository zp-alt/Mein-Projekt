<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>PRE Roll-up Grid</title>
<style>
  @font-face{font-family:"Roboto";font-weight:300;src:url("assets/fonts/Roboto-Light.ttf")}
  @font-face{font-family:"Roboto";font-weight:500;src:url("assets/fonts/Roboto-Medium.ttf")}
  @font-face{font-family:"Roboto";font-weight:700;src:url("assets/fonts/Roboto-Bold.ttf")}
  @font-face{font-family:"Roboto";font-weight:900;src:url("assets/fonts/Roboto-Black.ttf")}
  :root{ --ink:#1a1a1a; --paper:#faf8f4; --petrol:#11514c; --petrol-soft:#5d8b86; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{ size:850mm 2000mm; margin:0; }
  html,body{ background:#888; }
  body{ font-family:"Roboto",sans-serif; color:var(--ink); }
  .banner{ position:relative; width:850mm; height:2000mm; background:var(--paper); overflow:hidden;
           padding:110mm 70mm 120mm; display:flex; flex-direction:column; align-items:center; }

  .geo{ position:absolute; }
  .geo.ring{ width:150mm; height:150mm; border:6mm solid var(--petrol); border-radius:50%; top:-45mm; left:-45mm; }
  .geo.sq{ width:46mm; height:46mm; background:var(--ink); top:150mm; right:78mm; }
  .geo.tri{ width:0;height:0; border-left:30mm solid transparent; border-right:30mm solid transparent;
            border-bottom:52mm solid var(--petrol); top:150mm; right:150mm; }

  .logo{ width:230mm; height:230mm; display:block; }
  .brand{ font-weight:500; font-size:40pt; letter-spacing:.34em; text-transform:uppercase; color:var(--petrol); margin-top:14mm; }

  .grid{ margin-top:60mm; width:100%; flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;
         gap:12mm; }
  .grid .cell{ background-size:cover; background-repeat:no-repeat; }

  .foot{ margin-top:56mm; text-align:center; }
  .foot .hairline{ width:150mm; height:5mm; background:var(--petrol); margin:0 auto 30mm; }
  .foot .handle{ font-weight:900; font-size:104pt; letter-spacing:.01em; color:var(--ink); }
</style>
</head>
<body>
  <div class="banner">
    <div class="geo ring"></div>
    <div class="geo sq"></div>
    <div class="geo tri"></div>

    <img class="logo" src="assets/pre_logo.png" alt="PRE" />
    <div class="brand">Let&rsquo;s style together</div>

    <div class="grid">
      <div class="cell" style="background-image:url('assets/banner_afro.jpg');background-position:center 20%"></div>
      <div class="cell" style="background-image:url('assets/banner_curly.jpg');background-position:center 35%"></div>
      <div class="cell" style="background-image:url('assets/banner_welle.jpg');background-position:center 42%"></div>
      <div class="cell" style="background-image:url('assets/banner_bob.jpg');background-position:center 22%"></div>
    </div>

    <div class="foot">
      <div class="hairline"></div>
      <div class="handle">@pre.munich</div>
      <div style="font-weight:500;font-size:38pt;letter-spacing:.3em;text-transform:uppercase;color:var(--petrol-soft);margin-top:16mm">Art of Hair · München</div>
    </div>
  </div>
</body>
</html>
