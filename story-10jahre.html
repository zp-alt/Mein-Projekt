<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700;800;900&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 360px; height: 640px;
      background: #0a0a0a;
      font-family: 'Barlow', sans-serif;
      overflow: hidden;
    }
    .story {
      width: 360px; height: 640px;
      padding: 52px 32px 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .story::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 25% 65%, rgba(255,255,255,0.03) 0%, transparent 65%);
      pointer-events: none;
    }
    .brand {
      font-weight: 700; font-size: 10px;
      letter-spacing: 5px; text-transform: uppercase;
      color: rgba(255,255,255,0.18);
    }
    .body {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .tag {
      font-weight: 700; font-size: 11px;
      letter-spacing: 4px; text-transform: uppercase;
      color: rgba(255,255,255,0.3);
    }
    .big {
      font-weight: 900; font-size: 64px;
      line-height: 0.88; letter-spacing: -3px;
      text-transform: uppercase; color: #fff;
    }
    .emoji-line {
      font-size: 36px; line-height: 1;
      margin-top: -4px;
    }
    .check {
      font-weight: 800; font-size: 20px;
      letter-spacing: -0.3px;
      color: rgba(255,255,255,0.8);
      text-transform: uppercase;
    }
    .divider {
      width: 32px; height: 1px;
      background: rgba(255,255,255,0.18);
    }
    .italic {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 300;
      font-size: 21px; line-height: 1.38;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.3px;
    }
    .bottom {
      font-weight: 700; font-size: 10px;
      letter-spacing: 5px; text-transform: uppercase;
      color: rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>
<div class="story">
  <div class="brand">PRE · Art of Hair</div>
  <div class="body">
    <div class="tag">Stammkunde</div>
    <div class="big">10<br>JAHRE.</div>
    <div class="emoji-line">🚀</div>
    <div class="check">Faden ✅</div>
    <div class="divider"></div>
    <div class="italic">Nächstes Mal — endlich hab<br>ich ihn überzeugt einen<br>anderen Haarschnitt zu machen.</div>
  </div>
  <div class="bottom">München · PRE Art of Hair</div>
</div>
</body>
</html>
