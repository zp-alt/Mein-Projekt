<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700;800;900&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 360px; height: 640px;
      background: transparent;
      font-family: 'Barlow', sans-serif;
      overflow: hidden;
    }
    .story {
      width: 360px; height: 640px;
      padding: 52px 32px 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    /* Full dark scrim so text is legible over any photo */
    .story::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.55) 0%,
        rgba(0,0,0,0.40) 40%,
        rgba(0,0,0,0.65) 100%
      );
      pointer-events: none;
    }
    .brand {
      position: relative;
      font-weight: 700; font-size: 10px;
      letter-spacing: 5px; text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      text-shadow: 0 1px 8px rgba(0,0,0,0.8);
    }
    .body {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .tag {
      font-weight: 700; font-size: 11px;
      letter-spacing: 4px; text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      text-shadow: 0 1px 10px rgba(0,0,0,0.9);
    }
    .big {
      font-weight: 900; font-size: 72px;
      line-height: 0.86; letter-spacing: -3px;
      text-transform: uppercase; color: #fff;
      text-shadow: 0 2px 24px rgba(0,0,0,0.7);
    }
    .emoji-line {
      font-size: 38px; line-height: 1;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
    }
    .check {
      font-weight: 800; font-size: 22px;
      letter-spacing: -0.3px;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 1px 12px rgba(0,0,0,0.8);
    }
    .divider {
      width: 32px; height: 1px;
      background: rgba(255,255,255,0.35);
    }
    .italic {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 300;
      font-size: 22px; line-height: 1.4;
      color: rgba(255,255,255,0.88);
      letter-spacing: 0.3px;
      text-shadow: 0 1px 14px rgba(0,0,0,0.85);
    }
    .bottom {
      position: relative;
      font-weight: 700; font-size: 10px;
      letter-spacing: 5px; text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      text-shadow: 0 1px 8px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
<div class="story">
  <div class="brand">PRE · Art of Hair</div>
  <div class="body">
    <div class="tag">Stammkunde</div>
    <div class="big">10<br>JAHRE.</div>
    <div class="emoji-line">🚀</div>
    <div class="check">Faden ✅</div>
    <div class="divider"></div>
    <div class="italic">Nächstes Mal — endlich hab<br>ich ihn überzeugt einen<br>anderen Haarschnitt zu machen.</div>
  </div>
  <div class="bottom">München · PRE Art of Hair</div>
</div>
</body>
</html>
