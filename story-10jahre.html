<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700;800;900&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 360px; height: 640px;
      background: transparent;
      font-family: 'Barlow', sans-serif;
      overflow: hidden;
    }

    /* Gradient unten — Text lesbar über jedem Video */
    .gradient {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 400px;
      background: linear-gradient(to top,
        rgba(0,0,0,0.78) 0%,
        rgba(0,0,0,0.45) 55%,
        transparent 100%);
    }

    /* PRE Logo oben links */
    .logo {
      position: absolute;
      top: 26px; left: 28px;
      font-weight: 700; font-size: 10px;
      letter-spacing: 5px; text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }

    /* Text Block unten */
    .text-block {
      position: absolute;
      bottom: 42px; left: 28px; right: 28px;
    }

    .tag {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 300;
      font-size: 20px;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .main {
      font-weight: 900;
      font-size: 52px;
      line-height: 0.88;
      letter-spacing: -2px;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .faden {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 400;
      font-size: 22px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    .divider {
      width: 28px; height: 1px;
      background: rgba(255,255,255,0.3);
      margin-bottom: 14px;
    }

    .accent {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 300;
      font-size: 18px;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.3px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="gradient"></div>
  <div class="logo">PRE · Art of Hair</div>
  <div class="text-block">
    <div class="tag">Stammkunde seit</div>
    <div class="main">10<br>Jahre.</div>
    <div class="faden">Faden.</div>
    <div class="divider"></div>
    <div class="accent">Nächstes Mal — endlich hab<br>ich ihn überzeugt einen<br>anderen Haarschnitt zu machen.</div>
  </div>
</body>
</html>
