<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700;800;900&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 360px; height: 640px;
      background: #0d0d0d;
      font-family: 'Barlow', sans-serif;
      overflow: hidden;
    }

    /* Gradient unten — identisch wie overlay-story.html */
    .gradient {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 320px;
      background: linear-gradient(to top,
        rgba(0,0,0,0.72) 0%,
        rgba(0,0,0,0.35) 55%,
        transparent 100%);
    }

    .logo {
      position: absolute;
      top: 26px; right: 26px;
      font-weight: 700; font-size: 11px;
      letter-spacing: 5px; text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }

    .text-block {
      position: absolute;
      bottom: 38px; left: 28px; right: 28px;
    }

    .tag {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 300;
      font-size: 22px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .main {
      font-weight: 900;
      font-size: 46px;
      line-height: 0.92;
      letter-spacing: -1.5px;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .faden {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 400;
      font-size: 22px;
      color: rgba(255,255,255,0.85);
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .accent {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 300;
      font-size: 19px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.3px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="gradient"></div>
  <div class="logo">PRE</div>
  <div class="text-block">
    <div class="tag">Stammkunde seit</div>
    <div class="main">10<br>Jahre.</div>
    <div class="faden">Faden.</div>
    <div class="accent">Nächstes Mal — endlich hab<br>ich ihn überzeugt einen<br>anderen Haarschnitt zu machen.</div>
  </div>
</body>
</html>
