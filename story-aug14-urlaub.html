<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,300;1,200;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; }
    .wrap {
      width: 540px;
      height: 960px;
      position: relative;
      overflow: hidden;
    }

    /* Base: editorial photo */
    .photo-editorial {
      position: absolute; inset: 0;
      background-image: url(look52.jpeg);
      background-size: cover;
      background-position: center top;
    }

    /* Party glow */
    .photo-party {
      position: absolute; inset: 0;
      background-image: url(party-silhouettes.jpeg);
      background-size: cover;
      background-position: center center;
      opacity: 0.38;
      mix-blend-mode: screen;
    }

    /* Dark overlay */
    .overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.75) 0%,
        rgba(0,0,0,0.20) 35%,
        rgba(0,0,0,0.55) 65%,
        rgba(0,0,0,0.90) 100%
      );
    }

    .content {
      position: absolute; inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 72px 56px 80px;
    }

    .label {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.30);
    }

    .middle {
      display: flex;
      flex-direction: column;
    }

    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 58px;
      line-height: 1.1;
      color: #fff;
      letter-spacing: -0.5px;
      margin-bottom: 36px;
    }
    .headline .yellow { color: #FFE033; }

    .rule {
      width: 40px;
      height: 1px;
      background: rgba(255,255,255,0.20);
      margin-bottom: 36px;
    }

    .body {
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      font-size: 14px;
      line-height: 1.85;
      color: rgba(255,255,255,0.60);
      letter-spacing: 0.3px;
    }
    .body b {
      font-weight: 600;
      color: rgba(255,255,255,0.92);
    }

    .bottom {
      border-top: 1px solid rgba(255,255,255,0.10);
      padding-top: 22px;
    }
    .event-name {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 9px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #FFE033;
      margin-bottom: 7px;
    }
    .event-date {
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="photo-editorial"></div>
    <div class="photo-party"></div>
    <div class="overlay"></div>
    <div class="content">

      <div class="label">PRE Art of Hair</div>

      <div class="middle">
        <div class="headline">
          Kurz<br>
          aufladen.<br>
          <span class="yellow">Dann feiern.</span>
        </div>
        <div class="rule"></div>
        <div class="body">
          Ich bin die nächsten 16 Tage in den Alpen<br>
          und lade meine Batterien auf.<br><br>
          <b>Am 30. August bin ich zurück —<br>
          und dann feiern wir zusammen.</b><br><br>
          Save the Date. 🖤
        </div>
      </div>

      <div class="bottom">
        <div class="event-name">PRE — A Midsummer Night</div>
        <div class="event-date">30. August 2026 · Munich</div>
      </div>

    </div>
  </div>
</body>
</html>
