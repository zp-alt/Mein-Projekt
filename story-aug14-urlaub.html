<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,300;1,200;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; }
    .wrap {
      width: 540px;
      height: 960px;
      position: relative;
      overflow: hidden;
    }

    /* Sunset photo — full bleed */
    .photo {
      position: absolute; inset: 0;
      background-image: url(sunset-zyhra.jpeg);
      background-size: cover;
      background-position: center 30%;
    }

    /* Gradient overlay — heavy at bottom for text */
    .overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.45) 0%,
        rgba(0,0,0,0.05) 30%,
        rgba(0,0,0,0.10) 55%,
        rgba(0,0,0,0.88) 100%
      );
    }

    .content {
      position: absolute; inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 72px 56px 80px;
    }

    .label {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.50);
    }

    .bottom-block {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 58px;
      line-height: 1.08;
      color: #fff;
      letter-spacing: -0.5px;
      margin-bottom: 30px;
    }
    .headline .yellow { color: #FFE033; }

    .rule {
      width: 40px;
      height: 1px;
      background: rgba(255,255,255,0.22);
      margin-bottom: 28px;
    }

    .body {
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      font-size: 13px;
      line-height: 1.9;
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.3px;
      margin-bottom: 36px;
    }
    .body b {
      font-weight: 600;
      color: rgba(255,255,255,0.95);
    }

    .event-bar {
      border-top: 1px solid rgba(255,255,255,0.12);
      padding-top: 20px;
    }
    .event-name {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 9px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #FFE033;
      margin-bottom: 7px;
    }
    .event-date {
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="photo"></div>
    <div class="overlay"></div>
    <div class="content">

      <div class="label">PRE Art of Hair</div>

      <div class="bottom-block">
        <div class="headline">
          Kurz<br>
          aufladen.<br>
          <span class="yellow">Dann feiern.</span>
        </div>
        <div class="rule"></div>
        <div class="body">
          Ab morgen bin ich bis zum 24. August<br>
          in den Alpen und lade meine Batterien auf.<br><br>
          <b>Am 30. August feiern wir zusammen —<br>
          ich freu mich auf euch. 🖤</b>
        </div>
        <div class="event-bar">
          <div class="event-name">PRE — A Midsummer Night</div>
          <div class="event-date">30. August 2026 · Munich</div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
