<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700;800;900&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 360px; height: 640px;
      background: transparent;
      font-family: 'Barlow', sans-serif;
      overflow: hidden;
    }
    .story {
      width: 360px; height: 640px;
      padding: 48px 32px 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .brand {
      font-weight: 700; font-size: 10px;
      letter-spacing: 5px; text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }
    .body {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .line-italic {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 300;
      font-size: 26px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.5px;
      line-height: 1.3;
    }
    .line-big {
      font-weight: 900;
      font-size: 46px;
      line-height: 0.92;
      letter-spacing: -1.5px;
      text-transform: uppercase;
      color: #fff;
    }
    .line-warm {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 400;
      font-size: 22px;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.5px;
      line-height: 1.4;
    }
    .bottom {
      font-weight: 700; font-size: 10px;
      letter-spacing: 5px; text-transform: uppercase;
      color: rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>
<div class="story">
  <div class="brand">PRE · Art of Hair</div>
  <div class="body">
    <div class="line-italic">Ein Kunde hat mich<br>gesucht —</div>
    <div class="line-big">UND<br>GEFUNDEN.</div>
    <div class="line-warm">Und so was freut mich<br>halt schon riesig!!</div>
    <div class="line-italic">Danke für deinen Besuch.</div>
  </div>
  <div class="bottom">München · PRE Art of Hair</div>
</div>
</body>
</html>
