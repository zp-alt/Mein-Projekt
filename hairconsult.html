    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #0e0e0e;
      --card: #181818;
      --border: rgba(255,255,255,0.07);
      --text: #ffffff;
      --muted: rgba(255,255,255,0.42);
      --accent: #E8D9B8;
      --gold: #C4AA80;
      --gold-low: rgba(196,170,128,0.10);
      --gold-mid: rgba(196,170,128,0.22);
    }

    html { height: 100%; }

    body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      position: relative;
    }

    /* ─── SCREENS ─── */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 28px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
      transform: translateY(18px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .screen.active {
      opacity: 1;
      pointer-events: all;
      transform: translateY(0);
    }
    .screen.exit {
      opacity: 0;
      transform: translateY(-18px);
      pointer-events: none;
    }

    /* ─── WELCOME ─── */
    #s-welcome { text-align: center; gap: 0; }

    .pre-logo {
      font-size: 9px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 64px;
    }

    #s-welcome h1 {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(38px, 10vw, 56px);
      line-height: 1.1;
      color: var(--accent);
      margin-bottom: 20px;
    }

    #s-welcome p {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.5px;
      line-height: 1.8;
      margin-bottom: 60px;
    }

    .btn-primary {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: 'Barlow', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 5px;
      text-transform: uppercase;
      padding: 18px 44px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:active { background: var(--gold-low); }

    /* ─── NAME ─── */
    #s-name { text-align: center; gap: 0; }

    #s-name h2 {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(28px, 8vw, 42px);
      color: var(--accent);
      margin-bottom: 10px;
    }

    #s-name p {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 44px;
    }

    .name-input {
      width: 100%;
      max-width: 300px;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.18);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-size: 24px;
      font-weight: 300;
      text-align: center;
      padding: 10px 0;
      outline: none;
      margin-bottom: 52px;
      caret-color: var(--gold);
    }
    .name-input::placeholder { color: rgba(255,255,255,0.14); }

    /* ─── QUIZ ─── */
    #s-quiz {
      justify-content: flex-start;
      padding: 0;
      align-items: stretch;
    }

    .quiz-top {
      padding: 24px 28px 0;
      flex-shrink: 0;
    }

    .progress-bar {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.07);
      margin-bottom: 20px;
    }
    .progress-fill {
      height: 100%;
      background: var(--gold);
      transition: width 0.5s ease;
    }

    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }
    .q-number {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--gold);
      font-weight: 500;
    }
    .q-brand {
      font-size: 9px;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.12);
      font-weight: 600;
    }

    .q-text {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(22px, 6vw, 30px);
      color: var(--accent);
      line-height: 1.3;
      padding: 0 28px;
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .options {
      padding: 0 28px 40px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      flex: 1;
    }

    .option {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      color: rgba(255,255,255,0.80);
      font-family: 'Barlow', sans-serif;
      font-size: 14px;
      font-weight: 400;
      text-align: left;
      padding: 16px 20px;
      cursor: pointer;
      transition: all 0.18s;
      line-height: 1.5;
      border-radius: 2px;
    }
    .option:active, .option:hover { background: var(--gold-low); border-color: rgba(196,170,128,0.25); color: #fff; }
    .option.selected { background: var(--gold-mid); border-color: var(--gold); color: #fff; }

    #s-loading { text-align: center; gap: 28px; }

    .loading-brand {
      font-size: 9px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--gold);
    }

    .loading-dots {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .loading-dots span {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--gold);
      animation: dotpulse 1.2s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotpulse {
      0%, 80%, 100% { opacity: 0.12; transform: scale(0.7); }
      40% { opacity: 1; transform: scale(1); }
    }

    .loading-msg {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 20px;
      color: rgba(255,255,255,0.35);
      transition: opacity 0.5s;
    }

    /* ─── RESULT ─── */
    #s-result {
      justify-content: flex-start;
      padding-top: 60px;
      padding-bottom: 60px;
      text-align: center;
      gap: 0;
      overflow-y: auto;

    .result-brand {
      font-size: 9px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 44px;

    .result-greeting {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 1px;
      margin-bottom: 4px;

      font-weight: 300;

      text-transform: uppercase;

      letter-spacing: 1.5px;
      color: rgba(255,255,255,0.45);

      color: var(--gold);
      margin-bottom: 14px;

      margin: 0 auto 16px;
      background: var(--gold);
      border: none;
      color: #0e0e0e;
      font-family: 'Barlow', sans-serif;

      font-weight: 700;

      text-transform: uppercase;

      border: none;
      color: rgba(255,255,255,0.20);
      font-family: 'Barlow', sans-serif;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      padding: 10px;

</head>

    text: "Was nervt dich am meisten bei Haaren?",
    options: [
      { text: "Wenn es nicht sitzt — jede Linie muss stimmen", type: "editor" },
      { text: "Wenn es zu steif oder zu gemacht wirkt", type: "parisienne" },
      { text: "Wenn es langweilig und vorhersehbar ist", type: "rebel" },
      { text: "Wenn man sieht dass es zu viel Aufwand war", type: "nomad" },
      { text: "Wenn man es nicht bemerkt wenn man den Raum betritt", type: "icon" },
      { text: "Wenn es nichts über die Person erzählt", type: "artiste" }
    ]
  },
  {
    text: "Du verlässt den Friseursalon und willst dich fühlen wie...",
    options: [
      { text: "Präzise. Klar. Unantastbar.", type: "editor" },
      { text: "Feminin. Leicht. Als ob ich immer so ausgesehen hätte.", type: "parisienne" },
      { text: "Krass. Mutig. Anders als alle anderen.", type: "rebel" },
      { text: "Ich selbst — nur die beste Version davon.", type: "nomad" },
      { text: "Wie eine verdammte Ikone.", type: "icon" },
      { text: "Wie Kunst. Lebendig und einmalig.", type: "artiste" }
    ]
  }
];

let currentQ = 0;
let scores = {};
let clientName = '';
let isTransitioning = false;

function gotoScreen(id) {
  const all = document.querySelectorAll('.screen');
  const target = document.getElementById(id);
  all.forEach(s => {
    if (s.classList.contains('active')) {
      s.classList.add('exit');
      s.classList.remove('active');
      setTimeout(() => s.classList.remove('exit'), 400);
    }
  });
  setTimeout(() => {
    target.scrollTop = 0;
    target.classList.add('active');
  }, 120);
}

function startQuiz() {
  clientName = document.getElementById('name-input').value.trim() || 'du';
  currentQ = 0;
  scores = { editor: 0, parisienne: 0, rebel: 0, nomad: 0, icon: 0, artiste: 0 };
  renderQuestion();
  gotoScreen('s-quiz');
}

function renderQuestion() {
  const q = QUESTIONS[currentQ];
  const total = QUESTIONS.length;
  const pct = (currentQ / total) * 100;

  document.getElementById('q-number').textContent =
    String(currentQ + 1).padStart(2, '0') + ' / ' + String(total).padStart(2, '0');
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('q-text').textContent = q.text;

  const container = document.getElementById('options');
  container.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt.text;
    btn.onclick = () => pick(opt.type, btn);
    container.appendChild(btn);
  });
  document.getElementById('s-quiz').scrollTop = 0;
  isTransitioning = false;
}

function pick(type, btn) {
  if (isTransitioning) return;
  isTransitioning = true;
  btn.classList.add('selected');
  scores[type]++;
  setTimeout(() => {
    currentQ++;
    if (currentQ < QUESTIONS.length) {
      renderQuestion();
    } else {
      showLoading();
    }
  }, 300);
}

function showLoading() {
  gotoScreen('s-loading');
  const msgs = [
    'Wir lesen zwischen den Zeilen...',
    'Deine Essenz nimmt Form an...',
    'Deine Hair Identity ist bereit.'
  ];
  let i = 0;
  const el = document.getElementById('loading-msg');
  el.textContent = msgs[0];
  const iv = setInterval(() => {
    i++;
    if (i < msgs.length) el.textContent = msgs[i];
  }, 900);
  setTimeout(() => { clearInterval(iv); showResult(); }, 2700);
}

function showResult() {
  const winner = Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0];
  const arch = ARCHETYPES[winner];

  document.getElementById('result-client-name').textContent = clientName + ',';
  document.getElementById('result-archetype-name').textContent = arch.name;
  document.getElementById('result-tagline').textContent = arch.tagline;
  document.getElementById('result-desc').textContent = arch.desc;
  document.getElementById('result-hair').textContent = arch.hair;

  gotoScreen('s-result');
}

function restart() {
  document.getElementById('name-input').value = '';
  gotoScreen('s-welcome');
}

document.getElementById('name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') startQuiz();
});
</script>
