<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700;900&family=Cormorant+Garamond:ital,wght@1,200;1,300&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; }
    .wrap {
      width: 540px;
      height: 960px;
      position: relative;
      overflow: hidden;
      background: #0a0a0a;
    }

    /* Subtle party bg */
    .bg {
      position: absolute; inset: 0;
      background-image: url(party-silhouettes.jpeg);
      background-size: cover;
      background-position: center;
      opacity: 0.12;
    }

    .overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        135deg,
        rgba(0,0,0,0.85) 0%,
        rgba(0,0,0,0.60) 100%
      );
    }

    .content {
      position: absolute; inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 72px 56px 80px;
    }

    .label {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
    }

    .middle {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* Day — big impact */
    .day {
      font-family: 'Barlow', sans-serif;
      font-weight: 900;
      font-size: 88px;
      letter-spacing: -3px;
      text-transform: uppercase;
      color: #FFE033;
      line-height: 0.9;
      margin-bottom: 16px;
    }

    .time {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 200;
      font-size: 42px;
      color: rgba(255,255,255,0.90);
      letter-spacing: 1px;
      margin-bottom: 40px;
    }

    .rule {
      width: 40px;
      height: 1px;
      background: rgba(255,255,255,0.18);
      margin-bottom: 36px;
    }

    .body {
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      font-size: 15px;
      line-height: 1.85;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.3px;
    }
    .body b {
      font-weight: 600;
      color: rgba(255,255,255,0.92);
    }

    .bottom {
      border-top: 1px solid rgba(255,255,255,0.10);
      padding-top: 20px;
    }
    .salon {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 9px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bg"></div>
    <div class="overlay"></div>
    <div class="content">

      <div class="label">PRE Art of Hair</div>

      <div class="middle">
        <div class="day">Frei&shy;tag.</div>
        <div class="time">Ab 11 Uhr.</div>
        <div class="rule"></div>
        <div class="body">
          Ich hab noch Plätze frei —<br>
          <b>wer will, wer mag?</b><br><br>
          DM mir einfach oder bucht direkt. 🖤
        </div>
      </div>

      <div class="bottom">
        <div class="salon">PRE Art of Hair · Munich</div>
      </div>

    </div>
  </div>
</body>
</html>
