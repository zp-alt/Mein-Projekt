<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,300;1,200;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; }
    .wrap {
      width: 540px;
      height: 960px;
      position: relative;
      overflow: hidden;
    }

    /* Base: editorial photo */
    .photo-editorial {
      position: absolute; inset: 0;
      background-image: url(look52.jpeg);
      background-size: cover;
      background-position: center center;
    }

    /* Party glow over editorial */
    .photo-party {
      position: absolute; inset: 0;
      background-image: url(party-silhouettes.jpeg);
      background-size: cover;
      background-position: center center;
      opacity: 0.48;
      mix-blend-mode: screen;
    }

    /* Dark overlay — rich gradient for drama */
    .overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.72) 0%,
        rgba(0,0,0,0.20) 35%,
        rgba(0,0,0,0.50) 60%,
        rgba(0,0,0,0.88) 100%
      );
    }

    .content {
      position: absolute; inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 72px 56px 80px;
    }

    /* Top label */
    .label {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.30);
    }

    /* Middle — headline + program */
    .middle {
      display: flex;
      flex-direction: column;
    }

    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 62px;
      line-height: 1.08;
      color: #fff;
      letter-spacing: -1px;
      margin-bottom: 40px;
    }
    .headline .yellow { color: #FFE033; }

    /* Divider */
    .rule {
      width: 40px;
      height: 1px;
      background: rgba(255,255,255,0.20);
      margin-bottom: 44px;
    }

    /* Program timeline */
    .program {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .entry {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 24px;
    }

    .time {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 3px;
      color: #FFE033;
      min-width: 68px;
      padding-top: 3px;
    }

    .entry-text {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .entry-title {
      font-family: 'Barlow', sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.90);
    }

    .entry-detail {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 18px;
      color: rgba(255,255,255,0.52);
      line-height: 1.35;
    }

    /* Bottom */
    .bottom {
      border-top: 1px solid rgba(255,255,255,0.10);
      padding-top: 22px;
    }
    .event-name {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 9px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #FFE033;
      margin-bottom: 7px;
    }
    .event-location {
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="photo-editorial"></div>
    <div class="photo-party"></div>
    <div class="overlay"></div>
    <div class="content">

      <div class="label">PRE Art of Hair</div>

      <div class="middle">
        <div class="headline">
          PRE<br>
          Midsummer<br>
          <span class="yellow">Night.</span>
        </div>
        <div class="rule"></div>
        <div class="program">
          <div class="entry">
            <div class="time">16:00</div>
            <div class="entry-text">
              <div class="entry-title">Doors Open</div>
              <div class="entry-detail">NICNOA &amp; Co · Gabelberger Str. 73</div>
            </div>
          </div>
          <div class="entry">
            <div class="time">18:00</div>
            <div class="entry-text">
              <div class="entry-title">Kulinarische Reise</div>
              <div class="entry-detail">Albanien · Italien · Südtirol · Deutschland</div>
            </div>
          </div>
          <div class="entry">
            <div class="time"></div>
            <div class="entry-text">
              <div class="entry-title">Drinks &amp; Musik</div>
            </div>
          </div>
        </div>
      </div>

      <div class="bottom">
        <div class="event-name">PRE — A Midsummer Night</div>
        <div class="event-location">30. August 2026 · Munich</div>
      </div>

    </div>
  </div>
</body>
</html>
