<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700;900&family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #aaa; font-family: 'Barlow', sans-serif;
      padding: 48px 24px 64px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .label { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: #777; margin-bottom: 20px; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .num { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #999; }

    .slide {
      width: 360px; height: 360px;
      overflow: hidden; position: relative; flex-shrink: 0;
      background: #080808;
    }
    .photo {
      position: absolute; inset: 0;
      background-size: cover; background-repeat: no-repeat;
    }
    .bottom-fade {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 50%);
    }
    .cut-block {
      position: absolute; bottom: 22px; left: 24px; z-index: 5;
    }
    .index { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; color: rgba(255,255,255,0.3); margin-bottom: 4px; }
    .cut-name { font-weight: 900; font-size: 26px; letter-spacing: -0.5px; text-transform: uppercase; color: #fff; line-height: 1; }
    .cut-italic {
      font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300;
      font-size: 12px; color: rgba(255,255,255,0.38); letter-spacing: 1px; margin-top: 5px;
    }
    .logo {
      position: absolute; top: 22px; right: 22px;
      font-weight: 700; font-size: 10px; letter-spacing: 4px;
      text-transform: uppercase; color: rgba(255,255,255,0.28);
    }

    /* Option A — zyhra-5 editorial bob (bereits B&W) */
    .a .photo {
      background-image: url('zyhra-5-clean.png');
      background-position: center 20%;
      background-size: 130%;
      filter: contrast(1.1) brightness(0.9);
    }

    /* Option B — chess woman bob (B&W conversion) */
    .b .photo {
      background-image: url('feed-chess-woman.jpg');
      background-position: center 15%;
      filter: grayscale(100%) contrast(1.15) brightness(0.85);
    }

    /* Option C — precision bob back (B&W, sehr craft) */
    .c .photo {
      background-image: url('feed-nape.jpg');
      background-position: 35% center;
      filter: grayscale(100%) contrast(1.18) brightness(0.82);
    }
  </style>
</head>
<body>
<div class="label">Bob — 3 Optionen für das Karussell</div>
<div class="row">

  <div class="wrap"><div class="num">Option A — Editorial Bob</div>
  <div class="slide a">
    <div class="photo"></div>
    <div class="bottom-fade"></div>
    <div class="cut-block">
      <div class="index">04</div>
      <div class="cut-name">Bob.</div>
      <div class="cut-italic">Geometrie trifft Stille</div>
    </div>
    <div class="logo">PRE</div>
  </div></div>

  <div class="wrap"><div class="num">Option B — Chess Editorial Bob</div>
  <div class="slide b">
    <div class="photo"></div>
    <div class="bottom-fade"></div>
    <div class="cut-block">
      <div class="index">04</div>
      <div class="cut-name">Bob.</div>
      <div class="cut-italic">Geometrie trifft Stille</div>
    </div>
    <div class="logo">PRE</div>
  </div></div>

  <div class="wrap"><div class="num">Option C — Precision Nape Bob</div>
  <div class="slide c">
    <div class="photo"></div>
    <div class="bottom-fade"></div>
    <div class="cut-block">
      <div class="index">04</div>
      <div class="cut-name">Bob.</div>
      <div class="cut-italic">Die Rückseite lügt nie</div>
    </div>
    <div class="logo">PRE</div>
  </div></div>

</div>
</body>
</html>
